spring.application.name=ai-analysis-service

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

project-service.url=${PROJECT_SERVICE_URL:http://localhost:8082}

llm.provider=${LLM_PROVIDER:ollama}
llm.endpoint=${LLM_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}
llm.model=${LLM_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
llm.api.key=${LLM_API_KEY:}